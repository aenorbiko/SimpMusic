name: Enhanced signed ARM64 build
description: Shared Stable and Lab Android build, regression tests, permanent signing and APK verification.
inputs:
  channel:
    description: Build label displayed in the app
    required: true
  lab_property:
    description: Existing Gradle experiment property; empty for Stable
    required: false
    default: ''
  expected_package:
    description: Exact application ID to verify in the signed APK
    required: true
  clean_build:
    description: Disable restored Gradle caches
    required: false
    default: 'false'
  signing_bundle:
    description: Permanent signing bundle from repository secret
    required: true
  extra_tests:
    description: Optional repository shell script scripts/test_*.sh
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Configure Gradle cache arguments
      shell: bash
      env:
        CLEAN_BUILD: ${{ inputs.clean_build }}
      run: |
        set -euo pipefail
        if [ "$CLEAN_BUILD" = true ]; then
          echo "GRADLE_CACHE_ARGS=--no-build-cache --no-configuration-cache" >> "$GITHUB_ENV"
        else
          echo "GRADLE_CACHE_ARGS=--build-cache" >> "$GITHUB_ENV"
        fi
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Restore Gradle dependencies and task output cache
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-disabled: ${{ inputs.clean_build == 'true' }}
        cache-read-only: false
        # No encryption key: do not persist Configuration Cache across runners.
    - name: Verify approved Enhanced icon keeps 24dp shuffle geometry
      shell: bash
      run: python3 scripts/test_enhanced_shuffle_icons.py
    - name: Verify Enhanced support across playlists and albums
      shell: bash
      run: python3 scripts/test_enhanced_all_playlists.py
    - name: Verify stable release changelog, in-app link and safe merged branch housekeeping
      shell: bash
      run: python3 scripts/test_enhanced_changelog.py
    - name: Verify paired radio integration
      shell: bash
      run: python3 scripts/test_relevance_v2_integration.py
    - name: Apply enhanced controls to pinned core submodule
      shell: bash
      run: python3 scripts/apply_enhanced_core_patch.py
    - name: Verify headless restore and anonymous radio
      shell: bash
      run: |
        python3 scripts/test_headless_enhanced_restore.py
        python3 scripts/test_restored_notification_star.py
        python3 scripts/test_anonymous_enhanced_radio.py
        python3 scripts/test_start_radio_preserves_playback.py
    - name: Generate library definitions
      shell: bash
      run: ./gradlew $GRADLE_CACHE_ARGS exportLibraryDefinitions
    - name: Load permanent signing key, if configured
      shell: bash
      env:
        SIGNING_BUNDLE: ${{ inputs.signing_bundle }}
      run: |
        if [ -z "$SIGNING_BUNDLE" ]; then
          echo "::error::Missing SIMP_SIGNING_BUNDLE. Refusing to create an APK with an ephemeral debug key."
          exit 1
        else
          SIGNING_DIR="$RUNNER_TEMP/simpmusic-signing"
          install -d -m 700 "$SIGNING_DIR"
          printf '%s' "$SIGNING_BUNDLE" | base64 --decode | tar -xz -C "$SIGNING_DIR"
          test -s "$SIGNING_DIR/simpmusic-enhanced.jks"
          test -s "$SIGNING_DIR/signing.properties"
          echo "SIMP_SIGNING_DIR=$SIGNING_DIR" >> "$GITHUB_ENV"
          echo "Permanent signing credentials restored from GitHub secret."
        fi
    - name: Build one ARM64 APK
      shell: bash
      env:
        BUILD_CHANNEL: ${{ inputs.channel }}
        LAB_PROPERTY: ${{ inputs.lab_property }}
        EXPECTED_PACKAGE: ${{ inputs.expected_package }}
      run: |
        set -euo pipefail
        args=("-PsimpmusicEnhancedBuildChannel=$BUILD_CHANNEL")
        if [ -n "$LAB_PROPERTY" ]; then
          [[ "$LAB_PROPERTY" =~ ^simpmusic[A-Za-z0-9]+Experimental$ ]]
          [[ "$EXPECTED_PACKAGE" =~ ^com\.maxrave\.simpmusic\.dev\.[a-z0-9]+$ ]]
          python3 -c 'from pathlib import Path; import sys, xml.etree.ElementTree as ET; p=Path("androidApp/src/debug/res/values/app_name.xml"); tree=ET.parse(p); node=tree.find("./string[@name=\x27app_name\x27]"); assert node is not None; node.text="SimpMusic Lab ("+sys.argv[1].removesuffix(" Lab")+")"; tree.write(p, encoding="unicode")' "$BUILD_CHANNEL"
          args+=("-P$LAB_PROPERTY=true")
        else
          test "$EXPECTED_PACKAGE" = "com.maxrave.simpmusic.dev"
          test "$BUILD_CHANNEL" = "Enhanced Stable"
        fi
        ./gradlew $GRADLE_CACHE_ARGS :androidApp:assembleDebug "${args[@]}"
    - name: Verify APK uses the permanent signing certificate
      shell: bash
      run: |
        set -euo pipefail
        if [ -z "${SIMP_SIGNING_DIR:-}" ]; then
          echo "::error::Permanent signing directory is missing."
          exit 1
        fi
        APK="androidApp/build/outputs/apk/debug/androidApp-debug.apk"
        if [ ! -s "$APK" ]; then
          echo "::error::ARM64 APK not found. Available APKs:"
          find androidApp/build/outputs -name '*.apk' -print || true
          exit 1
        fi
        echo "ARM64 APK exists."
        python3 scripts/verify_arm64_only_apk.py "$APK"
        SIGNING_PROPS="$SIMP_SIGNING_DIR/signing.properties"
        STORE_PASS="$(sed -n 's/^storePassword=//p' "$SIGNING_PROPS" | tr -d '\r')"
        KEY_ALIAS="$(sed -n 's/^keyAlias=//p' "$SIGNING_PROPS" | tr -d '\r')"
        if [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
          echo "::error::Signing configuration fields missing."
          exit 1
        fi
        CERT="$RUNNER_TEMP/simpmusic-signing-cert.der"
        if ! keytool -exportcert -keystore "$SIMP_SIGNING_DIR/simpmusic-enhanced.jks" -storepass "$STORE_PASS" -alias "$KEY_ALIAS" -file "$CERT" >/dev/null 2>&1; then
          echo "::error::Cannot extract signing certificate from keystore."
          exit 1
        fi
        EXPECTED="$(sha256sum "$CERT" | cut -d' ' -f1)"
        echo "Expected signing certificate exported successfully."
        APKSIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -n 1)"
        if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
          echo "::error::Android SDK apksigner not found."
          exit 1
        fi
        echo "Android SDK apksigner found."
        if ! CERT_INFO="$("$APKSIGNER" verify --print-certs "$APK")"; then
          echo "::error::APK did not pass Android signature verification."
          exit 1
        fi
        # apksigner formatting varies between SDK versions; parse the digest
        # from any certificate SHA-256 line, not a hardcoded full-line prefix.
        ACTUAL="$(printf '%s\n' "$CERT_INFO" | tr -d '\r' | grep -i 'certificate.*SHA-256' | head -n 1 | grep -Eo '[0-9a-fA-F]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]' || true)"
        if [ -z "$ACTUAL" ]; then
          echo "::error::Could not parse certificate SHA-256 from apksigner output."
          printf '%s\n' "$CERT_INFO" | head -n 15
          exit 1
        fi
        if [ "$EXPECTED" != "$ACTUAL" ]; then
          echo "::error::APK signature does not match the permanent signing key."
          exit 1
        fi
        echo "Verified: APK signing certificate matches the private GitHub Actions keystore."
    - name: Verify shuffle ordering and current-track preservation
      shell: bash
      run: |
        ./gradlew $GRADLE_CACHE_ARGS :composeApp:jvmTest --rerun \
          --tests "com.maxrave.simpmusic.viewModel.UpcomingQueuePlannerTest" \
          --tests "com.maxrave.simpmusic.viewModel.UpcomingQueueMutationTest" \
          --tests "com.maxrave.simpmusic.viewModel.StartRadioQueuePlanTest" \
          --tests "com.maxrave.simpmusic.viewModel.EnhancedShufflePlannerTest" \
          --tests "com.maxrave.simpmusic.viewModel.SmartShuffleSourceTest" \
          --tests "com.maxrave.simpmusic.utils.EnhancedBuildIdentityTest" \
          --tests "com.maxrave.simpmusic.viewModel.EnhancedProgressiveQueueTest" \
          --tests "com.maxrave.simpmusic.viewModel.EnhancedRadioMetadataDiagnosticsTest" \
          --tests "com.maxrave.simpmusic.viewModel.EnhancedRadioRequestStatisticsTest" \
          --tests "com.maxrave.simpmusic.viewModel.EnhancedTrackDeduplicationTest" \
          --tests "com.maxrave.simpmusic.viewModel.EnhancedFullTrackTest" \
          --tests "com.maxrave.simpmusic.viewModel.EnhancedCompleteSourceTest" \
          --tests "com.maxrave.simpmusic.viewModel.EnhancedBatchGateTest" \
          --tests "com.maxrave.simpmusic.viewModel.EnhancedQueueSessionTest" \
          --tests "com.maxrave.simpmusic.utils.EnhancedForkUpdateTest" \
          --tests "com.maxrave.simpmusic.utils.EnhancedAboutDetailsTest"
    # Pinned upstream core contains an unrelated source-incompatible legacy test.
    # Only exclude it in this temporary runner checkout, as in the tested Lab workflow.
    - name: Test Bluetooth recommendation badge restoration (isolated core tests)
      shell: bash
      run: |
        set -euo pipefail
        LEGACY="core/data/src/jvmTest/kotlin/com/maxrave/data/librarysync/SyncSupportTest.kt"
        test -f "$LEGACY"
        mv "$LEGACY" "${LEGACY}.disabled"
        ./gradlew $GRADLE_CACHE_ARGS :data:jvmTest --rerun --tests "com.maxrave.data.mediaservice.RestoredEnhancedRecommendedIdsTest"
    - name: Verify APK package and export verified file path
      shell: bash
      env:
        EXPECTED_PACKAGE: ${{ inputs.expected_package }}
      run: |
        set -euo pipefail
        APK="androidApp/build/outputs/apk/debug/androidApp-debug.apk"
        AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt | sort -V | tail -n 1)"
        test -x "$AAPT"
        BADGING="$("$AAPT" dump badging "$APK")"
        ACTUAL_PACKAGE="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
        test "$ACTUAL_PACKAGE" = "$EXPECTED_PACKAGE"
        echo "SIMP_VERIFIED_APK=$APK" >> "$GITHUB_ENV"
        echo "Verified application ID: $ACTUAL_PACKAGE"
    - name: Run additional regression tests if provided
      if: ${{ inputs.extra_tests != '' }}
      shell: bash
      env:
        EXTRA_TESTS: ${{ inputs.extra_tests }}
      run: |
        set -euo pipefail
        [[ "$EXTRA_TESTS" =~ ^scripts/test_[a-zA-Z0-9_]+\.sh$ ]]
        test -f "$EXTRA_TESTS"
        bash "$EXTRA_TESTS"
