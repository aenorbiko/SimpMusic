name: Clean merged feature branches

on:
  # One-time cleanup of old branches when this workflow first reaches main.
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"
  # Future housekeeping equivalent to GitHub's "Automatically delete head branches".
  # Never touch unmerged or external PR branches.
  pull_request_target:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup-previously-merged:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify and delete four fully merged historical branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in \
            "feature/enhanced-shuffle" \
            "feature/enhanced-all-playlists" \
            "feature/enhanced-build-identity" \
            "feature/enhanced-progressive-queue"; do
            if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" >/dev/null 2>&1; then
              echo "Already deleted or unavailable: ${branch}"
              continue
            fi
            ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.ahead_by')"
            if [ "${ahead}" != "0" ]; then
              echo "::warning::Refusing to delete ${branch}: ${ahead} unique commits remain"
              continue
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted merged branch: ${branch}"
          done
      - name: Attempt to enable GitHub native auto-delete setting
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api -X PATCH "repos/${GITHUB_REPOSITORY}" -F delete_branch_on_merge=true --jq '.delete_branch_on_merge' 2>/dev/null; then
            echo "Native GitHub automatic branch cleanup was enabled."
          else
            echo "::notice::The Actions token cannot change repository administration settings. The merged-PR cleanup workflow below provides equivalent cleanup; enable the native GitHub toggle manually in Settings > General > Pull Requests if desired."
          fi

  cleanup-future-merged-pr:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete only merged internal feature branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          case "${HEAD_BRANCH}" in
            feature/*) ;;
            *) echo "Retaining non-feature branch: ${HEAD_BRANCH}"; exit 0 ;;
          esac
          if [ "${BASE_BRANCH}" != "main" ]; then
            echo "Not merged directly into main; retaining: ${HEAD_BRANCH}"
            exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/${HEAD_BRANCH}" >/dev/null 2>&1; then
            echo "Branch already deleted: ${HEAD_BRANCH}"
            exit 0
          fi
          ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${HEAD_BRANCH}" --jq '.ahead_by')"
          if [ "${ahead}" != "0" ]; then
            echo "::warning::Refusing to delete ${HEAD_BRANCH}: ${ahead} unique commits remain"
            exit 0
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${HEAD_BRANCH}"
          echo "Deleted merged feature branch: ${HEAD_BRANCH}"
