name: SimpMusic Enhanced Stable ARM64 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Build without restored Gradle caches (verification)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

# When several commits land close together, build only the newest version.
concurrency:
  group: simpmusic-enhanced-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Require a new Android versionCode for each Stable main revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT="$(sed -n 's/^version-code = "\([0-9]*\)"/\1/p' gradle/libs.versions.toml)"
          if [ -z "$CURRENT" ]; then
            echo "::error::Could not read current Android versionCode."
            exit 1
          fi
          if ! gh release view enhanced-latest --json body >/dev/null 2>&1; then
            echo "No prior Stable release found; versionCode is $CURRENT."
            exit 0
          fi
          NOTES="$(gh release view enhanced-latest --json body --jq '.body')"
          PREVIOUS="$(printf '%s\n' "$NOTES" | sed -n 's/^Android build: \([0-9]*\)$/\1/p' | head -n 1)"
          SOURCE="$(printf '%s\n' "$NOTES" | sed -n 's/^Source commit: \([0-9a-f]*\)$/\1/p' | head -n 1)"
          if [ -z "$PREVIOUS" ] || [ -z "$SOURCE" ]; then
            echo "::error::Published Stable release lacks a verifiable Android build or source commit."
            exit 1
          fi
          if [ "$SOURCE" = "$GITHUB_SHA" ]; then
            echo "Rebuilding the same published Stable revision (build $CURRENT)."
          elif [ "$CURRENT" -le "$PREVIOUS" ]; then
            echo "::error::New main revision must increase Android versionCode above published build $PREVIOUS (got $CURRENT)."
            exit 1
          else
            echo "Stable versionCode increases from $PREVIOUS to $CURRENT."
          fi
      - name: Build and test signed Stable APK
        uses: ./.github/actions/enhanced-android-build
        with:
          channel: Enhanced Stable
          expected_package: com.maxrave.simpmusic.dev
          clean_build: ${{ inputs.clean_build == true }}
          signing_bundle: ${{ secrets.SIMP_SIGNING_BUNDLE }}
      - name: Publish one ARM64 APK for direct download (no ZIP)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_CODE="$(sed -n 's/^version-code = "\([0-9]*\)"/\1/p' gradle/libs.versions.toml)"
          CHANGELOG_URL="https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md"
          RELEASE_NOTES="$(python3 scripts/generate_stable_release_notes.py CHANGELOG.md "$VERSION_CODE" "$GITHUB_SHA" "$CHANGELOG_URL")"
          bash scripts/publish_enhanced_apk.sh enhanced-latest SimpMusic-Enhanced-arm64.apk "SimpMusic Enhanced (latest)" "$RELEASE_NOTES"
      - name: Delete all obsolete Actions APK archives after Release succeeds
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.name == "simpmusic-enhanced-debug") | .id' > "$RUNNER_TEMP/obsolete-artifact-ids.txt"
          count=0
          while read -r artifact_id; do
            [ -z "$artifact_id" ] && continue
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > /dev/null
            count=$((count + 1))
          done < "$RUNNER_TEMP/obsolete-artifact-ids.txt"
          echo "Removed $count obsolete Enhanced APK archives. The signed ARM64 APK is retained in GitHub Releases."
