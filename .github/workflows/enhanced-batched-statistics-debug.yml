name: SimpMusic Batched Statistics Lab ARM64 APK
on:
  push:
    branches: [feature/enhanced-batched-statistics]
  workflow_dispatch:
    inputs:
      clean_build:
        description: Build without restored Gradle caches
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: enhanced-batched-statistics-latest-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-debug:
    uses: ./.github/workflows/enhanced-lab-build.yml
    with:
      channel: Batched Statistics Lab
      lab_property: simpmusicSharedLabExperimental
      expected_package: com.maxrave.simpmusic.dev.startradio
      release_tag: enhanced-batched-statistics-latest
      asset_name: SimpMusic-Batched-Statistics-arm64.apk
      expected_branch: feature/enhanced-batched-statistics
      clean_build: ${{ inputs.clean_build == true }}
      publish: true
      shared_update: true
      whats_new: |
        - Save Enhanced statistics in groups.
        - Keep missing recommendation counts across restarts.
    secrets:
      signing_bundle: ${{ secrets.SIMP_SIGNING_BUNDLE }}
